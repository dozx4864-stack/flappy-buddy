<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#70c5ce" />
    <title>Flappy Buddy</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 290px; min-height: 100vh; display: grid; place-items: center; color: #153040; background: radial-gradient(circle at 50% 5%, #fff7d5 0, #dff5f2 35%, #b9e3e2 100%); }
      .game-shell { width: min(100%, 500px); padding: 26px 20px 30px; text-align: center; }
      header { margin-bottom: 18px; }.eyebrow { margin: 0 0 5px; font-size: .68rem; font-weight: 800; letter-spacing: .16em; color: #39757a; }
      h1 { margin: 0; font-size: clamp(2.15rem, 8vw, 3rem); line-height: 1; letter-spacing: -.07em; } h1 span { color: #ee8a35; }
      .game-wrap { position: relative; overflow: hidden; aspect-ratio: 21 / 32; border: 6px solid #fff; border-radius: 25px; box-shadow: 0 18px 38px rgba(32, 94, 102, .25); background: #70c5ce; touch-action: manipulation; }
      canvas { width: 100%; height: 100%; display: block; cursor: pointer; }.hud { position: absolute; z-index: 1; top: 20px; left: 50%; transform: translateX(-50%); color: white; text-shadow: 0 2px 0 rgba(29, 91, 101, .25); pointer-events: none; }
      .hud span { display: block; font-size: .68rem; font-weight: 900; text-transform: uppercase; letter-spacing: .14em; }.hud strong { display: block; font-size: 2.2rem; line-height: 1; }
      .screen { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 22px; background: linear-gradient(#0000 10%, rgba(9, 71, 80, .12)); }.screen.hidden { display: none; }
      .card { width: min(100%, 290px); padding: 22px 18px 16px; border: 2px solid rgba(255,255,255,.85); border-radius: 20px; background: rgba(255,255,255,.91); box-shadow: 0 10px 24px rgba(10, 75, 82, .18); }.buddy { font-size: 3rem; line-height: 1; filter: drop-shadow(0 3px 0 #db8731); }
      h2 { margin: 10px 0 5px; font-size: 1.45rem; }.card p { margin: 0 0 15px; color: #547078; font-size: .92rem; }
      .theme-picker { margin: 0 0 14px; text-align: left; }.theme-picker > span { display: block; margin-bottom: 6px; color: #547078; font-size: .68rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }.theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      button { width: 100%; border: 0; border-radius: 12px; padding: 12px 16px; color: #fff; background: #e98131; box-shadow: inset 0 -3px 0 #c96622; font: inherit; font-weight: 800; cursor: pointer; } button:hover { background: #ed9346; } button:focus-visible { outline: 3px solid #186b70; outline-offset: 3px; }
      .theme-option { padding: 9px 7px; color: #547078; background: #e8f1f1; box-shadow: none; font-size: .78rem; }.theme-option:hover { background: #dbeaea; }.theme-option.selected { color: #fff; background: #367b83; box-shadow: inset 0 -2px 0 #235d63; }
      small { display: block; margin-top: 12px; color: #688087; font-size: .68rem; } kbd { border-radius: 4px; padding: 1px 4px; background: #e5eff0; font: inherit; font-weight: 800; }.instructions { margin: 16px 0 0; color: #35676c; font-size: .8rem; font-weight: 600; }
      @media (max-height: 760px) { .game-shell { padding-block: 14px; } header { margin-bottom: 10px; } .instructions { margin-top: 9px; } }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">A LITTLE FLIGHT, A BIG ADVENTURE</p>
        <h1>Flappy <span>Buddy</span></h1>
      </header>
      <section class="game-wrap" aria-label="Flappy Buddy game">
        <canvas id="game" width="420" height="640" aria-label="Game area"></canvas>
        <div class="hud" aria-live="polite"><span>Score</span><strong id="score">0</strong></div>
        <div id="screen" class="screen">
          <div class="card">
            <div class="buddy" aria-hidden="true">🐤</div>
            <h2 id="screen-title">Ready to fly?</h2>
            <p id="screen-copy">Guide Buddy through the garden gates.</p>
            <div id="theme-picker" class="theme-picker" role="group" aria-label="Choose a background mode">
              <span>Background</span>
              <div class="theme-options">
                <button class="theme-option selected" type="button" data-theme="day" aria-pressed="true">☀️ Day</button>
                <button class="theme-option" type="button" data-theme="night" aria-pressed="false">🌙 Night</button>
              </div>
            </div>
            <button id="action" type="button">Start game</button>
            <small>Press <kbd>Space</kbd>, <kbd>↑</kbd>, or tap to flap</small>
          </div>
        </div>
      </section>
      <p class="instructions">Tap or click anywhere in the game to flap your wings.</p>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
        const scoreEl = document.querySelector('#score'), screen = document.querySelector('#screen');
        const title = document.querySelector('#screen-title'), copy = document.querySelector('#screen-copy'), action = document.querySelector('#action');
        const themePicker = document.querySelector('#theme-picker'), themeOptions = [...document.querySelectorAll('.theme-option')];
        const W = canvas.width, H = canvas.height, groundY = H - 72;
        const state = { running: false, over: false, score: 0, last: 0, spawn: 0, theme: 'day', bird: null, pipes: [] };
        function reset() { state.running = false; state.over = false; state.score = 0; state.spawn = 0; state.pipes = []; state.bird = { x: 112, y: H * .44, vy: 0, r: 17, tilt: 0 }; scoreEl.textContent = '0'; title.textContent = 'Ready to fly?'; copy.textContent = 'Guide Buddy through the garden gates.'; action.textContent = 'Start game'; themePicker.hidden = false; screen.classList.remove('hidden'); draw(); }
        function start() { if (state.over) reset(); state.running = true; screen.classList.add('hidden'); flap(); }
        function flap() { if (!state.running) { start(); return; } state.bird.vy = -360; }
        function addPipe() { const gap = 154, min = 95, max = groundY - gap - 95; state.pipes.push({ x: W + 46, top: min + Math.random() * (max - min), gap, scored: false }); }
        function end() { if (state.over) return; state.running = false; state.over = true; title.textContent = 'Nice try, Buddy!'; copy.textContent = `You flew through ${state.score} ${state.score === 1 ? 'gate' : 'gates'}.`; action.textContent = 'Fly again'; themePicker.hidden = false; screen.classList.remove('hidden'); }
        function hit(pipe, b) { const left = pipe.x - 31, right = pipe.x + 31; return b.x + b.r > left && b.x - b.r < right && (b.y - b.r < pipe.top || b.y + b.r > pipe.top + pipe.gap); }
        function update(dt) { const b = state.bird; b.vy += 980 * dt; b.y += b.vy * dt; b.tilt = Math.max(-.45, Math.min(1.05, b.vy / 580)); state.spawn += dt; if (state.spawn > 1.55) { addPipe(); state.spawn = 0; } state.pipes.forEach(p => { p.x -= 160 * dt; if (!p.scored && p.x < b.x) { p.scored = true; state.score++; scoreEl.textContent = state.score; } }); state.pipes = state.pipes.filter(p => p.x > -55); if (b.y - b.r < 0 || b.y + b.r > groundY || state.pipes.some(p => hit(p, b))) end(); }
        function roundedRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
        function drawPipe(x, y, h, upsideDown) { const capY = upsideDown ? y + h - 19 : y; ctx.fillStyle = '#5ba54e'; roundedRect(x - 29, y, 58, h, 8); ctx.fill(); ctx.fillStyle = '#79c55b'; roundedRect(x - 22, y + 5, 15, h - 10, 4); ctx.fill(); ctx.fillStyle = '#438a41'; roundedRect(x - 35, capY, 70, 20, 6); ctx.fill(); ctx.fillStyle = '#9ad66b'; ctx.fillRect(x - 29, capY + 4, 18, 5); }
        function drawBird(b) { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.tilt); ctx.fillStyle = '#efb83e'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#f6d469'; ctx.beginPath(); ctx.ellipse(-5, 4, 10, 7, .45, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -6, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#213e48'; ctx.beginPath(); ctx.arc(10, -6, 2.1, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#e97932'; ctx.beginPath(); ctx.moveTo(17, 1); ctx.lineTo(28, 5); ctx.lineTo(17, 9); ctx.fill(); ctx.restore(); }
        function draw() { const night = state.theme === 'night', sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, night ? '#111b42' : '#70c5ce'); sky.addColorStop(1, night ? '#59619a' : '#c7eef0'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H); if (night) { ctx.fillStyle = 'rgba(255,244,190,.9)'; [[56,92],[145,56],[250,117],[349,70],[385,184],[210,170]].forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }); ctx.fillStyle = '#fff0ae'; ctx.beginPath(); ctx.arc(350, 106, 29, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#202a59'; ctx.beginPath(); ctx.arc(362, 95, 29, 0, Math.PI * 2); ctx.fill(); } else { ctx.fillStyle = 'rgba(255,255,255,.55)'; [[75,100,32],[310,145,47],[235,63,25]].forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.arc(x+r,y+5,r*.72,0,Math.PI*2); ctx.arc(x-r,y+7,r*.65,0,Math.PI*2); ctx.fill(); }); } state.pipes.forEach(p => { drawPipe(p.x, 0, p.top, true); drawPipe(p.x, p.top + p.gap, groundY - p.top - p.gap, false); }); ctx.fillStyle = '#91bc55'; ctx.fillRect(0, groundY, W, H-groundY); ctx.fillStyle = '#6b9d45'; ctx.fillRect(0, groundY, W, 8); for (let x = -20; x < W + 20; x += 24) { ctx.fillStyle = x % 48 ? '#acd06a' : '#c3df7a'; ctx.fillRect(x, groundY + 8, 13, H - groundY - 8); } drawBird(state.bird); }
        function loop(time) { const dt = Math.min((time - state.last) / 1000 || 0, .034); state.last = time; if (state.running) update(dt); draw(); requestAnimationFrame(loop); }
        action.addEventListener('click', e => { e.stopPropagation(); start(); });
        themeOptions.forEach(option => option.addEventListener('click', e => { e.stopPropagation(); state.theme = option.dataset.theme; themeOptions.forEach(item => { const selected = item === option; item.classList.toggle('selected', selected); item.setAttribute('aria-pressed', selected); }); draw(); }));
        canvas.addEventListener('pointerdown', flap); window.addEventListener('keydown', e => { if (['Space', 'ArrowUp'].includes(e.code)) { e.preventDefault(); flap(); } }); reset(); requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
