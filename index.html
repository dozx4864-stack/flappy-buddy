<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#70c5ce" />
    <title>Flappy Buddy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">A LITTLE FLIGHT, A BIG ADVENTURE</p>
        <h1>Flappy <span>Buddy</span></h1>
      </header>
      <section class="game-wrap" aria-label="Flappy Buddy game">
        <canvas id="game" width="420" height="640" aria-label="Game area"></canvas>
        <div class="hud" aria-live="polite"><span>Score</span><strong id="score">0</strong></div>
        <div id="screen" class="screen">
          <div class="card">
            <div class="buddy" aria-hidden="true">🐤</div>
            <h2 id="screen-title">Ready to fly?</h2>
            <p id="screen-copy">Guide Buddy through the garden gates.</p>
            <div id="theme-picker" class="theme-picker" role="group" aria-label="Choose a background mode">
              <span>Background</span>
              <div class="theme-options">
                <button class="theme-option selected" type="button" data-theme="day" aria-pressed="true">☀️ Day</button>
                <button class="theme-option" type="button" data-theme="night" aria-pressed="false">🌙 Night</button>
              </div>
            </div>
            <button id="action" type="button">Start game</button>
            <small>Press <kbd>Space</kbd>, <kbd>↑</kbd>, or tap to flap</small>
          </div>
        </div>
      </section>
      <p class="instructions">Tap or click anywhere in the game to flap your wings.</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
